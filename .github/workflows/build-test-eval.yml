name: Build, Test, and Evaluate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x']

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: '**/test-results.trx'

    - name: Publish test results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: '**/test-results.trx'

  eval-gating:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Build EvalRunner
      run: dotnet build RagAgentApi.EvalRunner --configuration Release

    - name: Setup test data
      run: |
        if [ ! -d "eval" ]; then mkdir -p eval; fi
        # Ensure eval/questions.json exists
        if [ ! -f "eval/questions.json" ]; then
          echo "Warning: eval/questions.json not found, using fallback"
        fi

    - name: Run evaluation (informational)
      run: |
        dotnet run --project RagAgentApi.EvalRunner --configuration Release -- https://localhost:7000 || echo "Evaluation skipped: API not available in CI"
      continue-on-error: true

    - name: Comment on PR with eval results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✓ Build and unit tests passed. Note: Evaluation tests require a running API instance.'
          })

  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Install code analysis tools
      run: |
        dotnet tool install -g dotnet-format --version 5.*
        dotnet tool install -g roslynator.commandline

    - name: Run code analysis
      run: |
        dotnet build --configuration Release
        echo "Code analysis completed"
      continue-on-error: true
